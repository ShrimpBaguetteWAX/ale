<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070f" />
    <!--
      The same mark alienlegends.io flies. It serves a WebP named .ico, so
      the honest declaration is the .webp; the .ico beside it is the same
      bytes under the name a browser guesses at when it ignores the link.
    -->
    <link rel="icon" href="./favicon.webp" type="image/webp" />

    <title>Alien Legends</title>
    <meta
      name="description"
      content="Recruit. Strategize. Compete. Rise through the ranks and become a Legend."
    />

    <!--
      The game's own fonts (styles/fonts.css): Orbitron for display, Titillium
      Web for text, served from here so first paint waits on no other server.
      The two every screen needs first are fetched before the stylesheet asks.
    -->
    <link rel="preload" as="font" type="font/woff2" href="./assets/fonts/titillium-400-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="./assets/fonts/orbitron-latin.woff2" crossorigin />

    <!-- Warm the TCP/TLS handshake to the fastest WAX nodes before any read. -->
    <link rel="preconnect" href="https://wax.greymass.com" crossorigin />
    <link rel="preconnect" href="https://api.hivebp.io" crossorigin />

    <link rel="preload" as="image" href="./assets/logo.webp" />

    <!-- The boot screen's look, shared with components/BootScreen.tsx. -->
    <script type="module" crossorigin src="./assets/index-CljXXlN8.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/react-BnBjmWcX.js">
    <link rel="modulepreload" crossorigin href="./assets/router-YOXIOte-.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CfL6TUO4.css">
    <script>addEventListener('load',function(){setTimeout(function(){(window.requestIdleCallback||setTimeout)(function(){var l=document.createElement('link');l.rel='prefetch';l.as='style';l.crossOrigin='';l.href='./assets/game-BSlnleSl.css';document.head.appendChild(l)},{timeout:3000})},4000)})</script>
  </head>

  <body>
    <div id="root"></div>
    <div id="boot" class="bootscreen" role="status" aria-label="Loading">
      <div class="bootscreen__ring">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="bootarc-static" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#00baff" stop-opacity="0" />
              <stop offset="0.6" stop-color="#00baff" />
              <stop offset="1" stop-color="#f6a800" />
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="49.2" fill="none" stroke="url(#bootarc-static)" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="80 229" />
        </svg>
        <img src="./assets/logo.webp" alt="Alien Legends" />
      </div>
      <span class="bootscreen__word">Loading</span>
    </div>
    <!-- When the ring started turning, so the game's copy carries on from the same angle. -->
    <script>
      window.__bootT0 = performance.now()
    </script>
    <noscript>
      <p style="padding: 24px; color: #e8eeff; font-family: system-ui">
        Alien Legends needs JavaScript to talk to the WAX blockchain.
      </p>
    </noscript>
  </body>
</html>
